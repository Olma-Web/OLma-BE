name: Deploy Monitoring

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'monitoring/**'
      - '.github/workflows/deploy-monitoring.yml'

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Connect olma-backend to monitoring network
        run: |
          docker network create monitoring 2>/dev/null || true
          docker network connect monitoring olma-backend 2>/dev/null || true

      - name: Ensure monitoring environment file
        run: |
          if [ ! -f /home/ubuntu/monitoring.env ]; then
            cat > /home/ubuntu/monitoring.env << 'EOF'
          DISCORD_WEBHOOK_URL=https://discord.com/api/webhooks/WEBHOOK_ID/WEBHOOK_TOKEN
          EOF
            sed -i 's/^          //' /home/ubuntu/monitoring.env
            chmod 600 /home/ubuntu/monitoring.env
          fi

      - name: Deploy monitoring stack
        working-directory: monitoring
        run: |
          docker compose up -d --remove-orphans
          docker compose restart prometheus grafana
