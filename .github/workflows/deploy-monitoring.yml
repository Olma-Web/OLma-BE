name: Deploy Monitoring

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'monitoring/**'
      - '.github/workflows/deploy-monitoring.yml'

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Connect olma-backend to monitoring network
        run: |
          docker network create monitoring 2>/dev/null || true
          docker network connect monitoring olma-backend 2>/dev/null || true

      - name: Ensure monitoring environment file
        run: |
          touch /home/ubuntu/monitoring.env
          grep -q '^DISCORD_WEBHOOK_URL=' /home/ubuntu/monitoring.env || \
            echo 'DISCORD_WEBHOOK_URL=https://discord.com/api/webhooks/WEBHOOK_ID/WEBHOOK_TOKEN' >> /home/ubuntu/monitoring.env
          grep -q '^GRAFANA_ADMIN_PASSWORD=' /home/ubuntu/monitoring.env || \
            echo "GRAFANA_ADMIN_PASSWORD=$(openssl rand -base64 24)" >> /home/ubuntu/monitoring.env
          chmod 600 /home/ubuntu/monitoring.env

      - name: Deploy monitoring stack
        working-directory: monitoring
        run: |
          set -a
          . /home/ubuntu/monitoring.env
          set +a
          docker compose up -d --remove-orphans
          docker exec grafana grafana cli admin reset-admin-password "$GRAFANA_ADMIN_PASSWORD"
          docker compose restart prometheus grafana
