apiVersion: 1

groups:
  - orgId: 1
    name: OLma Backend Alerts
    folder: OLma Alerts
    interval: 30s
    rules:
      - uid: olma_backend_down
        title: Backend Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: olma-prometheus
            model:
              datasource:
                type: prometheus
                uid: olma-prometheus
              editorMode: code
              expr: 1 - up{job="olma-backend"}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Error
        for: 1m
        annotations:
          summary: OLma backend is down or unreachable
          description: Prometheus cannot scrape the olma-backend target.
        labels:
          service: olma-backend
          severity: critical
        isPaused: false

      - uid: olma_api_5xx_errors
        title: 5xx API Error
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: olma-prometheus
            model:
              datasource:
                type: prometheus
                uid: olma-prometheus
              editorMode: code
              expr: sum(increase(http_server_requests_seconds_count{job="olma-backend", method!="OPTIONS", status=~"5..", uri=~"/v1/.*"}[2m])) or vector(0)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: OLma API 5xx errors detected
          description: One or more /v1 API requests returned 5xx responses in the last 2 minutes.
        labels:
          service: olma-backend
          severity: critical
        isPaused: false

      - uid: olma_api_latency_high
        title: API Latency High
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: olma-prometheus
            model:
              datasource:
                type: prometheus
                uid: olma-prometheus
              editorMode: code
              expr: ((sum(rate(http_server_requests_seconds_sum{job="olma-backend", method!="OPTIONS", uri=~"/v1/.*"}[5m])) / sum(rate(http_server_requests_seconds_count{job="olma-backend", method!="OPTIONS", uri=~"/v1/.*"}[5m]))) and (sum(rate(http_server_requests_seconds_count{job="olma-backend", method!="OPTIONS", uri=~"/v1/.*"}[5m])) > 0)) or vector(0)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1.5
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 3m
        annotations:
          summary: OLma API average latency is high
          description: Average /v1 API latency stayed above 1.5 seconds for 3 minutes.
        labels:
          service: olma-backend
          severity: warning
        isPaused: false
